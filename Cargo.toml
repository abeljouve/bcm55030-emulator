[package]
name = "bcm55030-emulator"
version = "0.1.0"
edition = "2021"
description = "BCM55030 SoC emulator (big-endian ARC700 / ARCompact core)"
license = "AGPL-3.0-only"
repository = "https://github.com/abeljouve/bcm55030-emulator"
default-run = "arc700"

[[bin]]
name = "arc700"
path = "src/bin/arc700.rs"

[[bin]]
name = "arc700-gui"
path = "src/bin/arc700-gui.rs"
required-features = ["ui"]

[features]
default = []
# Enable the egui/eframe GUI layer. Pulls in native windowing.
ui  = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:egui-phosphor", "dep:rfd"]

[dependencies]
libc = "0.2"
parking_lot = "0.12"
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
object = { version = "0.38", default-features = false, features = ["read", "elf", "std"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1",    features = ["rt-multi-thread", "macros", "sync", "net"] }
axum         = "0.8"
schemars     = "1"
tracing      = "0.1"
rmcp         = { version = "1.4",  features = [
    "server",
    "client",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "schemars",
    "macros",
] }

# --- optional deps for the `ui` feature --------------------------------
eframe       = { version = "0.34", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui         = { version = "0.34", optional = true }
egui_extras  = { version = "0.34", optional = true, features = ["all_loaders"] }
egui-phosphor = { version = "0.12", optional = true, default-features = false, features = ["regular"] }
rfd          = { version = "0.17", optional = true }
